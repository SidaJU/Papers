const COMMIT = '5191756e8c4f16de2b63c28636341f2d4f5cdf2e';
const GROUPS = {
 input:{color:'#707965',tint:'#f0f2eb',name:'观测 / 标签'},

const N = (id,group,x,y,title,subtitle,shapes,note,body,refs,training=false) => ({id,group,x,y,title,subtitle,shapes,note,body,refs,training});
const E = (from,to,label='',kind='flow') => ({from,to,label,kind});
const GRAPHS = {
 paper:{label:'01 论文训练',scope:'以正式论文 §3 / Fig.1–2 为准；形状含批维 B。黄色 Query 是模型参数，粉色连线是监督标签。',formula:'论文 Eq.(12)：Ltotal = Laction + Ltrack + Ldepth；§4.1 三项权重均为 1。',nodes:[
  N('p-rgb','input',0,0,'当前多视角 RGB','只编码当前观测，不喂未来图像',['B × V × 3 × Himg × Wimg','V = 3 views'],'2 个环境视角 + 1 个腕部视角。','<p>当前时刻的三张 RGB 图像提供场景观测。V 表示视角数，3 表示 RGB 通道数；二者不可混淆。</p><p>论文 §4.1 指定两个环境视角与一个腕部视角。224×224 是其明确给出的环境深度监督分辨率；此处不替论文补造 RGB patch 或尺寸设置。</p>',[P(3,'Fig.1 · 当前图像'),P(6,'§4.1 · 观测与监督')]),
  N('p-text','input',0,185,'语言指令','任务语义 L',['B × Ltxt'],'例如拾取目标物并放入指定位置。','<p>语言是当前任务指令，不是预测的未来描述。分词后作为 2D token 组的一部分进入 VLM。</p>',[P(3,'Fig.1 / §3.1')]),
  N('p-history','input',0,370,'历史 3D 关键点轨迹','机器人运动历史，不是物体点云',['B × K × Thist × 3'],'仿真 K=8；真机 K=7。','<p>论文记录机器人关节与末端执行器的历史 3D 坐标。每个关键点各有一段时间序列；不是把相机 RGB 直接当成坐标，也不是输入完整场景点云。</p><p>§4.1：LIBERO / RoboCasa 使用 7 个关节与 1 个末端点；真机为 6 个关节与 1 个末端点。图中 Thist 是历史长度的记号，不预设代码采样方式。</p>',[P(3,'§3.2 · Track Encoder'),P(6,'§4.1 · K 的设置')]),
  N('p-state','input',0,655,'当前本体状态','proprioceptive state Qt',['B × ds'],'不要把状态维度和 7 维动作混同。','<p>当前本体状态经投影变成 State token，服务动作专家。论文用 Qt 表示状态，但没有把其具体实现尺寸固定为动作的 7 维。</p>',[P(3,'§3.1'),P(5,'§3.4 · State Token')]),
  N('p-vision','backbone',300,0,'SigLIP 视觉编码','π0 / PaliGemma 视觉通路',['B × Nimg × C'],'图像编码并投影到语言模型宽度。','<p>基座是 π0，VLM 使用 PaliGemma 与 SigLIP 视觉编码器。Nimg 表示所有视角图像 token 的总数；论文视图不为 patch 数补造常数。</p><p>本方法不是冻结 3D teacher 对齐方法，也不是先重建 mesh 再给动作网络。</p>',[P(3,'§3.1 · Base VLA model')]),
  N('p-words','backbone',300,185,'文本 Token Embedding','与图像组成 2D token block',['B × Ltxt × C'],'C = 2048（论文实验设置）。','<p>文本 embedding 与图像 embedding 共同构成 2D token block。论文的 block-wise causal mask 指定不同块之间的可见性，而不是所有 token 完全双向互看。</p>',[P(5,'§3.4 · Attention'),P(6,'§4.1 · C')]),
  N('p-history-encoder','token',300,370,'Track Encoder','一条轨迹压缩成一个 token',['B × K × C'],'共享历史 query，cross-attend 轨迹。','<p>对每个关键点轨迹先做 MLP 嵌入，以共享的可学习历史 query 为 Q，轨迹嵌入为 K/V 做 cross-attention。</p><div class="equation">Zhist[k] = CrossAttn(Qhist, MLP(Tk), MLP(Tk))</div><p>输出 K 个历史 token。推理时该编码仍需要执行，不能与未来轨迹解码器一起删除。</p>',[P(3,'§3.2 · Eq.(1)'),P(5,'§3.4 · Inference')]),
  N('p-queries','token',600,0,'可学习未来 / 空间 Queries','未来轨迹 K 个 + 粗空间网格 N 个',['B × K × C','B × N × C'],'Qspatial = Qinit + 3D sinusoidal PE。','<p>K 个 future track queries 表示各关键点的未来运动。空间 queries 定义于粗体素网格，添加 x/y/z 三轴拼接的正弦位置编码。</p><div class="equation">N = Nx·Ny·Nz<br>Qspatial = Qinit + PEspatial</div><p>它们是训练得到的参数，不是未来关键点或真实深度标签。推理保留这些 query tokens。</p><div class="warning">论文给出 1.6×1.6×1.0 m、v=0.04 m 与每轴 4 倍降采样，但 z 方向得到 6.25；正文未交代整数网格取整。这里保留 N 为符号，不臆造整数。</div>',[P(4,'§3.2–3.3 · Eq.(4)'),P(6,'§4.1 · 空间参数')]),
  N('p-backbone','backbone',600,235,'共享 VLM Transformer','2D → 历史 → 3D queries',['future embeddings: B × K × C','spatial embeddings: B × N × C'],'分块因果；不是全序列双向。','<p>按论文 §3.4，输入依次为 2D tokens、历史 3D tokens、3D queries，再由 State / Action Noise 块完成动作通路。</p><p>同一块内部双向，跨块只看本块与之前的块。Action Expert 通过各层 attention 上下文利用隐式未来信息；不是把显式预测深度当成推理输入。</p>',[P(3,'Fig.1'),P(5,'Fig.2 / §3.4')]),
  N('p-flow','action',300,655,'动作训练输入','真实动作 chunk + 噪声 / 流时间',['At: B × 50 × 7'],'GT 动作参与 flow-matching 训练。','<p>训练用真实动作 chunk 与高斯噪声构造流匹配输入，学习条件速度场。这里的连续流时间与预测未来场景的离散时刻 τ 是不同变量。</p><p>论文动作 7 维：3 维平移偏移、3 维旋转偏移、1 维夹爪控制。实际 RoboCasa 接口维度和 padding 单独放在开源视图。</p>',[P(3,'§3.1 · action chunk'),P(5,'§3.4 · Laction')],true),
  N('p-expert','action',600,655,'Action Expert','π0 连续动作通路',['B × H × da'],'使用逐层上下文，训练预测速度场。','<p>动作专家是具有独立参数的机器人控制分支。图中 VLM → Expert 代表各层 attention 的信息通路，不是仅把 VLM 最后一个输出向量接到 MLP。</p><p>状态 token、动作噪声 tokens 和流时间嵌入共同形成动作通路；生成 50 步 action chunk。</p>',[P(3,'§3.1 · Base VLA'),P(5,'§3.4 · Attention / Inference')]),
  N('p-track','token',900,0,'未来轨迹解码','共享 MLP + 时间位置编码',['B × K × (H+1) × 3'],'论文：当前 t 与 t+1…t+50。','<div class="equation">p̂[k,t+τ] = MLP(efut[k] + PEtime[τ])<br>τ = 0,…,H</div><p>共享 MLP 对各关键点、各时刻预测 3D 位置。这不是把预测动作做正向运动学再得到轨迹，也不是每一步重新运行 VLM。</p><p>预测轨迹既接受 MSE 监督，也指导几何分支选择需要加密的体素。显式解码是训练期计算。</p>',[P(4,'§3.2 · Eq.(2–3)')],true),
  N('p-voxel','geometry',900,245,'时间条件 + Voxel Decoder','同一空间隐变量预测多个时刻',['Espatial + PEtime[τ]','Fvoxel: B × X × Y × Z × C′'],'3D 转置卷积 / 上采样；C′=256。','<p>每个时刻将同一组空间 embeddings 加上该时刻的 temporal PE，再 reshape 成粗网格，送入 3D 解码器恢复细网格分辨率。</p><div class="equation">Espatial[t+τ] = Espatial + PEtime[τ]</div><p>论文描述每轴上采样 4 倍。这里 X/Y/Z 指细网格数量，不与图像 H/W 或动作 horizon H 混用。未来各帧不是显式 GS 动力学递推。</p>',[P(4,'§3.3 · Eq.(5–6)'),P(6,'§4.1 · C′')],true),
  N('p-track-gt','input',900,450,'真实关键点位置','训练监督标签',['B × K × (H+1) × 3'],'未来 GT 只进入损失，不进入 VLM。','<p>论文 Eq.(3) 将预测轨迹与真实关键点位置比较。图中的标签边不是模型推理的数据输入。</p>',[P(4,'Eq.(3)')],true),
  N('p-action-loss','loss',900,655,'动作损失 Laction','conditional flow matching',['scalar'],'学习动作速度场，而非动作分类。','<p>使用 π0 连续条件流匹配目标。论文未把它改为离散动作交叉熵。与轨迹、深度监督一起更新系统。</p>',[P(5,'§3.4 · Eq.(12)')],true),
  N('p-refine','geometry',1200,0,'Track-guided Refinement','预测关键点命中的体素加密',['每个选中体素 +64 Gaussians'],'Mrefine 由预测轨迹确定。','<div class="equation">Mrefine[V] = 1 ⇔ ∃ p̂[k,t+τ] ∈ V</div><p>对预测关键点所在体素，共享 MLP 从该体素特征生成额外 64 个高斯；论文中它们叠加到全局初始高斯，而不是全场景统一提高分辨率。</p><p>硬体素选择不是天然可微操作。论文的示意数据箭头不能解释成索引过程对位置处处可微。</p>',[P(4,'§3.3 · Eq.(7–8)'),P(6,'§4.1 · N′G=64')],true),
  N('p-coarse','geometry',1200,245,'初始全局 Gaussians','细体素特征 → 几何基元',['每体素 NG=4','g = {μ, α, Σ}'],'只建模几何，不学习颜色系数。','<p>末端 3D 卷积从体素特征输出高斯参数。每个高斯有中心 μ、不透明度 α、协方差 Σ。</p><p>论文采用每体素 4 个初始高斯。它们不是作为模型输入的真实点云，也不是用来直接生成动作的碰撞网格。</p>',[P(4,'§3.3 · Voxel Decoder'),P(6,'§4.1 · NG')],true),
  N('p-track-loss','loss',1200,655,'轨迹损失 Ltrack','关键点 × 时间的 MSE',['scalar'],'当前与未来时刻均计入（论文）。','<div class="equation">Ltrack = Σk,τ ‖p̂[k,t+τ] − pgt[k,t+τ]‖² / [K(H+1)]</div><p>按论文 Eq.(3) 归一化。实际代码的 reduce 维度、抽样时间和放大系数须看开源实现，不能自动与此公式逐项等同。</p>',[P(4,'Eq.(3)')],true),
  N('p-union','geometry',1500,115,'合并几何集合','全局结构 + 局部精细结构',['Gtotal = Ginit ∪ Grefine'],'每个预测时刻独立形成完整场景。','<p>轨迹引导的加密只发生于交互相关区域；全局粗表示仍然保留。论文 Eq.(8) 是集合合并，不是输出一个 mesh，也不涉及 RGB 重建。</p>',[P(4,'Eq.(8)')],true),
  N('p-depth-gt','input',1500,420,'真实深度 + 相机标定','仅训练使用的几何监督',['2 环境视角 × 224 × 224','camera intrinsics / extrinsics'],'深度反投影 + 工作空间边界形成掩码。','<p>两个外部相机提供未来深度监督，腕部相机只在观测侧使用。结合相机标定进行渲染，并通过深度反投影和工作空间边界得到 Mspatial。</p><p>Eq.(11) 前文没有明确说明反投影使用 GT 还是预测深度；该来源需由代码另外核对，不能从公式自动推断。</p><p>这些监督数据不是推理时必须额外执行的 3D 渲染；推理路径不读取未来深度标签。</p>',[P(5,'Eq.(9–11)'),P(6,'§4.1 · Depth supervision')],true),
  N('p-depth-loss','loss',1500,655,'掩码深度损失 Ldepth','工作空间内的多视角 L1',['scalar'],'按有效像素数归一化。','<div class="equation">Ldepth = Στ,c,r Mspatial(r) · |D̂c,t+τ(r) − Dgtc,t+τ(r)| / Σ Mspatial</div><p>只监督工作空间相关区域的几何，深度而非 RGB。论文写所有 H+1 时刻；公开代码的时刻抽样另行显示。</p>',[P(5,'Eq.(11)')],true),
  N('p-render','geometry',1800,115,'可微深度渲染','按相机投影并做 α compositing',['D̂: cameras × time × pixels'],'Ti = ∏j<i (1−αj)。','<div class="equation">D̂(r) = Σi Ti αi di</div><p>对像素射线投影覆盖的高斯按前后顺序合成深度。di 是高斯中心沿相机方向的深度。颜色系数被省略。</p><p>反向传播通过可微渲染约束高斯、解码器和共享表征；不能把硬体素命中索引也一并宣称为可微。</p>',[P(5,'Eq.(9–10)')],true),
  N('p-total','loss',1800,655,'联合优化','动作 + 运动学 + 几何',['Ltotal = Laction + Ltrack + Ldepth'],'论文三项 λ 均为 1。','<p>论文方法是对 VLA 加入预测性训练监督。不是推理时先把未来场景完整生成，再交给另一个规划器搜索动作。</p><p>§4.1 报告 AdamW、40,000 iterations、学习率 2.5×10⁻⁵、总 batch 32、8 张 H20。这些是论文报告的设置，不等于本地已复现实验。</p>',[P(5,'Eq.(12)'),P(6,'§4.1 · Implementation details')],true)
 ],edges:[E('p-rgb','p-vision','当前图像'),E('p-text','p-words','token ids'),E('p-history','p-history-encoder','3D 历史'),E('p-vision','p-backbone','2D image tokens'),E('p-words','p-backbone','2D text tokens'),E('p-history-encoder','p-backbone','K history tokens'),E('p-queries','p-backbone','可学习 queries','parameter'),E('p-backbone','p-track','future embeddings'),E('p-backbone','p-voxel','spatial embeddings'),E('p-track','p-refine','体素选择','guide'),E('p-voxel','p-refine','选中体素特征'),E('p-voxel','p-coarse','全体素特征'),E('p-refine','p-union','额外局部高斯'),E('p-coarse','p-union','全局初始高斯'),E('p-union','p-render','Gtotal'),E('p-depth-gt','p-render','相机标定','parameter'),E('p-render','p-depth-loss','预测深度'),E('p-depth-gt','p-depth-loss','GT depth + mask','target'),E('p-track','p-track-loss','预测 3D 点'),E('p-track-gt','p-track-loss','GT 3D 点','target'),E('p-state','p-expert','state token'),E('p-flow','p-expert','noisy action / time'),E('p-backbone','p-expert','逐层 attention 上下文','cache'),E('p-expert','p-action-loss','速度场'),E('p-flow','p-action-loss','flow target','target'),E('p-action-loss','p-total','Laction'),E('p-track-loss','p-total','Ltrack'),E('p-depth-loss','p-total','Ldepth')]},
 code:{label:'02 开源实现',scope:'固定代码 5191756 · RoboCasa 训练实际路径。论文概念与实现常数分开列；所有尺寸均由源码及直接算术推导。',formula:'代码总损失 = 动作 MSE + 当前 / 未来轨迹 MSE + 左右相机的当前 / 未来 masked Smooth L1；没有 RGB loss。',nodes:[
  N('c-rgb','input',0,0,'三路当前 RGB','left / right / wrist；各自一张图',['每路 B × 3 × 224 × 224'],'resize + CHW；训练只做颜色扰动。','<p>数据集读取左、右环境相机与腕部图像，转 RGB、resize-with-pad、CHW、缩放到 [0,1]。模型预处理在训练时施加 ColorJitter，再映射到 [-1,1]。</p><p>三张图分别通过同一个 SigLIP；没有将三路 RGB 拼成 9 通道。几何监督图像不走这条 prefix 输入路径。</p>',[C('data_processing/robocasa_dataset.py',61,66),C('data_processing/data_transform.py',10,17),C('data_processing/utils.py',12,40)]),
  N('c-text','input',0,215,'指令分词','SentencePiece / PaliGemma',['ids / mask: B × 48'],'BOS + 指令 + 换行；截断 / 补齐。','<p>清理下划线和换行后，指令以 BOS 开头，额外编码换行作为答复起始标记；截断或填充到 48 个位置。padding 位置带有效性 mask，不应理解为全部 48 个均有语义。</p>',[C('models/tokenizer.py',5,24)]),
  N('c-history','input',0,430,'历史关键点缓冲区','8 个关键点，排除当前时刻',['B × 1000 × 8 × 3','his_len: B'],'step=0 使用长度 1 的全零历史。','<p>数据集从 <code>keypoints.npy</code> 读取历史 <code>[:step]</code>，放入容量 1000 的零填充缓冲区。step=0 时 his_len=1，实际输入是全零点，而不是当前真实关键点。</p><p>真实长度由 his_len 控制，不能把所有 1000 帧都算有效历史；也不是每次固定取最近 50 帧。</p>',[C('data_processing/robocasa_dataset.py',79,90)]),
  N('c-control','input',0,700,'状态与动作标签','RoboCasa 接口 → padding / 归一化',['state: B × 8 → B × 32','actions: B × 50 × 12 → ×32'],'真实接口不是论文泛化定义的 7 维。','<p>状态取 infos 的前 8 维，动作取第 8:20 列共 12 维。二者填充到 32 维，按各自 mean/std 归一化。</p><p>动作帧为 t…t+49（越界重复最后帧），而关键点 / 深度未来标签为 t+1…t+50。padding 通道也在公开代码的 action MSE 中取均值。</p>',[C('data_processing/robocasa_dataset.py',68,75),C('models/geopredict.py',265,286)],true),
  N('c-vision','backbone',315,0,'SigLIP patch encoder','27 层；patch 14 × 14',['每视角 B × 256 × 2048'],'内部宽度 1152，输出投影 2048。','<p>224/14=16，因此每张图有 16×16=256 个 patch tokens，三视角共 768 个。不是每图只输出一个 CLS token。</p><p>代码：内部宽度 1152，27 个 encoder blocks、16 heads；LayerNorm 后线性投影到 2048。默认 pool_type=none。</p>',[C('models/siglip.py',43,99),C('models/geopredict.py',146,155)]),
  N('c-text-embed','backbone',315,215,'文本 Embedding','PaliGemma 词表 257,152',['B × 48 × 2048'],'embedding 乘 √2048，保留 token mask。','<p>Embedder 由输入词表查表，再乘嵌入宽度平方根。文本 tokens 与所有视角图像 tokens 同属一个 fully bidirectional 2D block。</p>',[C('models/gemma.py',8,8),C('models/gemma.py',54,64),C('models/geopredict.py',157,163)]),
  N('c-history-patch','token',315,430,'历史时间 Patch Embedding','Conv1d：3 → 256，kernel=stride=4',['B × ceil(Thist/4) × 8 × 256'],'有效历史末帧重复，补齐到 4 的倍数。','<p>逐样本截取有效历史，若长度不是 4 的倍数则重复该样本末帧。按关键点将时间序列送入 Conv1d，再恢复时间 patch 维。</p><p>随后各点独立使用共享 cross-attention 参数；这比论文 Eq.(1) 的 MLP 概念描述更具体。</p>',[C('models/keypoints.py',8,49)]),
  N('c-history-cross','token',630,430,'共享 Query Cross-Attention','Q 宽 512；K/V 宽 256',['每关键点 1 query','输出 B × 8 × 2048'],'8 heads；时间 PE 加到 Key，不加到 Value。','<p>共享的 1×1×512 可学习 query 对每个关键点的历史 patches 聚合。Key 加时间正弦 PE；Value 仍为原 patch features，并按真实 patch 长度屏蔽 padding。</p><p>Cross-attention 带残差和 FFN，再经 Linear/MLP、归一化及 512→2048 projection，得到 8 个历史 tokens。</p>',[C('models/keypoints.py',74,108),C('models/keypoints.py',150,213)]),
  N('c-queries','token',630,0,'8 轨迹 + 320 空间 Queries','空间网格 8 × 8 × 5',['8 × 2048','320 × 2048'],'空间位置编码拼接：800 + 800 + 448。','<p>keypoint_embedding 与 spatial_embedding 都是可学习参数。空间 query 另加三轴正弦 PE，长度分别 800/800/448，总计 2048。</p><p>future_pos 单独有 50 个时间编码；当前帧不加时间 PE，未来帧按真实相对帧偏移索引。</p>',[C('models/geopredict.py',74,94),C('models/geopredict.py',114,126)]),
  N('c-prefix','backbone',630,215,'Prefix 拼接与五组 Mask','2D | 历史 | 3D queries',['B × 1152 × 2048'],'768 图像 + 48 文本 + 8 历史 + 8 轨迹 + 320 空间。','<p>1152 是包含 padding 位置的序列长度，来自源码计数相加；有效文本位置由 input mask 决定。</p><p>future track 与 spatial queries 同一个注意力块。通过 mask_ar 的前缀和实现块因果；加上 suffix 的 State 与 Action，完整训练序列共 1203 个位置。</p>',[C('models/geopredict.py',21,28),C('models/geopredict.py',141,191)]),
  N('c-gemma','backbone',945,245,'18 层双 Expert Transformer','prefix 2048 / action 1024',['prefix_out: B × 1152 × 2048','suffix_out: B × 51 × 1024'],'两套参数，逐层拼 Q/K/V 做共享 attention。','<p>Gemma-2B 配置：width 2048、18 层、FFN 16384；action Expert：width 1024、18 层、FFN 4096。二者都使用 8 个 query heads、1 个 KV head、head_dim 256。</p><p>每层分别投影两路 token 的 Q/K/V，在序列维拼接后按五组 mask 做 attention，再分回各 Expert，使用各自输出投影和 FFN。不是 VLM 跑完后才调用另一个独立 Transformer。</p>',[C('models/gemma.py',21,37),C('models/gemma.py',88,191),C('models/gemma.py',207,297)]),
  N('c-track','token',945,0,'当前 / 未来 XYZ 线性头','Linear 2048 → 3，共享权重',['当前 B × 8 × 3','未来 B × 50 × 8 × 3'],'同一有效相对帧偏移的位移是共享的。','<p>从 prefix_out 中空间 token 之前的 8 个位置取得轨迹 embeddings。当前坐标直接线性投影；未来 embeddings 复制 50 次并加 temporal PE，再用同一个 Linear 输出坐标。加PE后没有再经过Transformer或非线性轨迹解码器。</p><p>有效相对偏移Δ=1…50对应future_pos[Δ−1]。末尾重复帧按真实offset取PE；valid_mask只控制加PE，不屏蔽loss。</p><div class="equation">p̂now(b,k) = W·h(b,k) + b0<br>p̂future(b,k,Δ) = W·(h(b,k)+PE[Δ−1]) + b0<br>p̂future − p̂now = W·PE[Δ−1]</div><div class="warning">对固定权重、相同有效Δ，在忽略浮点舍入的线性算术下，未来相对当前的位移对所有样本和关键点相同。绝对位置仍依赖h(b,k)；末尾钳制时必须比较相同真实Δ，不能只比较槽位编号。</div><p>这是当前发布轨迹头的可直接推导约束，不是已实测失败，也不代表非线性的VoxelDecoder、动作专家或整篇论文模型与样本无关。</p>',[C('models/geopredict.py',117,120),C('models/geopredict.py',290,312)],true),
  N('c-kpt-target','input',945,475,'当前 + 50 个未来 GT 点','t 与 clamp(t+1…t+50)',['B × 8 × 3','B × 50 × 8 × 3'],'到 episode 末尾时重复最后一帧。','<p>当前 keypoint 真值与未来 50 帧真值分开提供。它们只进入各自 MSE，不进入 prefix，也不替代 refinement 使用的预测点。</p><p>公开实现逐一处理全部 50 个未来时间槽，并没有只监督三个采样时刻。</p>',[C('data_processing/robocasa_dataset.py',89,104),C('models/geopredict.py',290,312)],true),
  N('c-track-loss','loss',1260,0,'两个轨迹 MSE 分别相加','当前位置 + 未来位置',['mean over B,K,xyz','future mean over B,50,K,xyz'],'不是将 51 帧一次统一求平均。','<p>current_keypoint_loss 与 future_keypoint_loss 各自调用 square(...).mean()，再分别加入总损失，没有额外的 100 或 1000 倍系数。</p><p>因此当前帧和整个未来段各占一项；与论文 Eq.(3) 对 H+1 帧统一归一化的写法不同。</p>',[C('models/geopredict.py',290,312),P(4,'Eq.(3)')],true),
  N('c-time','geometry',1260,245,'空间特征 + 50 时间 PE','当前空间 tokens 不加时间 PE',['当前 B × 320 × 2048','未来 (B·50) × 320 × 2048'],'当前与未来复用同一 VoxelDecoder。','<p>取 prefix 最后的 320 个 spatial tokens。当前先解码一次；未来复制 50 次、加与轨迹相同的 temporal PE，再将 B×50 合并送入解码器。</p><p>每个未来空间场由共享 embedding 与时间条件生成，不是高斯中心上一帧到下一帧递推。</p>',[C('models/geopredict.py',314,320),C('models/geopredict.py',415,421)],true),
  N('c-decoder','geometry',1575,245,'VoxelDecoder 的真实层级','2048→512；两次 ×2，再插值',['8×8×5 → 16×16×10','→32×32×20 →40×40×25'],'最终特征 C′=128，不是注释中的 256。','<p>Linear 2048→512 + LayerNorm → reshape。ConvTranspose3d 512→512（stride2）+BN+ReLU；512→256（stride2）+BN+ReLU；256→128（stride1）+BN+ReLU。</p><p>最后 trilinear interpolate 到 40×40×25，保存 128 通道体素特征；Conv3d 128→56 输出每体素 4×14 个参数。</p><div class="warning">geopredict.py 某些行内注释仍写 [256,…]，但 head.py 的实际输出与 refine_gs_mlp 的输入均为 128；本图按可执行定义标注。</div>',[C('models/head.py',5,49),C('models/geopredict.py',135,139)],true),
  N('c-select','geometry',1575,0,'关键点命中 + 3³ 邻域','floor / long / 去重后的硬索引',['M 个有效选中体素','每点至多 27 个候选'],'预测点只指导选择，不是 GS 的真实中心。','<p>对预测关键点按 4 cm 网格取 floor，再扩张到 3×3×3 邻域，过滤越界邻域、合并重复体素，得到 M 个索引。</p><p>这是不可微的硬选择：坐标转整数不会把 depth loss 沿索引回传到关键点输出头；depth loss 仍通过选中体素特征回传到空间 decoder / shared backbone。</p><p>helper 返回原关键点合法性 mask，但当前调用使用的是邻域合法性 mask；轻微越界点若有邻域落在域内，仍可能选中边界体素。</p>',[C('models/utils.py',59,92),C('models/geopredict.py',351,359),C('models/geopredict.py',431,441)],true),
  N('c-base','geometry',1890,245,'全局 160,000 高斯','40 × 40 × 25 × 4',['每帧 B × 160000 × 14'],'14 通道中确有 3 个 RGB 通道。','<p>原始 14 维为 offset[3]、opacity[1]、scale[3]、quaternion[4]、rgb[3]。中心 = 网格中心 + 原始 offset；opacity 经 sigmoid，scale 经 softplus(beta20) 并上限 0.04，rotation 归一化。</p><p>输出按 [mean3, rgb3, opacity1, quaternion4, scale3] 重排。代码虽定义 offset_act，但此路径直接使用 raw offsets，没有调用 tanh 限幅。</p>',[C('models/geopredict.py',225,244),C('models/geopredict.py',314,320)],true),
  N('c-refine','geometry',1890,0,'局部 MLP 生成 M×64 高斯','128 → 256 → 512 → 896',['M × 64 × 14'],'三个 Linear 连续堆叠，中间无激活。','<p>按选中整数索引取 128 维体素特征，送入三个 Linear 后 reshape 为每体素 64×14。64 个中心初始化为该 4 cm 体素内 4×4×4、1 cm 间隔的小格中心，再加 raw offsets。</p><p>局部 scale 上限 0.02，opacity/rotation/rgb 激活同全局分支。不是对已有高斯直接复制 64 次，也不是自适应训练步中的 densification 操作。</p>',[C('models/geopredict.py',135,139),C('models/geopredict.py',357,378)],true),
  N('c-union','geometry',2205,115,'按帧拼接高斯','全局 + 轨迹引导的局部集合',['160000 + 64M 个 / 帧'],'M 随样本与时刻变化，不是常数 8。','<p>M 是去重并裁剪后的邻域体素数，不等于关键点数。B 中各个样本、各未来时刻分别生成集合并渲染。</p><p>全局高斯始终保留；局部 refinement 额外增加几何表达。</p>',[C('models/geopredict.py',380,389),C('models/geopredict.py',431,473)],true),
  N('c-cameras','input',1890,475,'两外部相机内外参','GT depth 反投影与 GS 渲染共享',['K: B × 2 × 3 × 3','c2w: B × 2 × 4 × 4'],'cams.npy 零基索引 1 / 3；K 缩放 224/256。','<p>数据集读取左右相机参数，左乘像素尺寸缩放矩阵修正 K。模型将 outer 取 inverse 作为 c2w，再构造投影矩阵。</p><p>当前与所有未来帧复用这两组相机矩阵。工作域固定为 [0,0,0] 到 [1.6,1.6,1.0]，单位米。若接入移动相机，不能默认这段代码已经处理未来外参变化。</p>',[C('data_processing/robocasa_dataset.py',118,130),C('models/geopredict.py',322,341),C('models/gaussian.py',8,47)],true),
  N('c-render','geometry',2205,450,'GaussianRasterizer','深度 / alpha / RGB 都可返回',['depth: B × 2 × 1 × 224 × 224'],'训练损失只使用 depth 返回值。','<p>传入中心、颜色、不透明度、quaternion、scale 与相机矩阵。代码调用深度版 diff_gaussian_rasterization，并汇总 image、alpha、depth 三种结果。</p><p>只取 depth 计算监督；没有 RGB photometric 或 SSIM loss。这与“代码没有颜色参数”不是同一句话。</p>',[C('models/gaussian.py',168,240),C('models/geopredict.py',391,411),C('models/geopredict.py',475,495)],true),
  N('c-depth-target','input',1575,720,'当前 / 未来深度标签','GT depth + workspace mask',['当前每相机 B × 224 × 224','未来每相机 B × 50 × 224 × 224'],'GT 最近邻缩放；不经过 RGB 色彩增强。','<p>读取两个环境相机预制的depth npy；按源码的原尺寸注释从256×256最近邻缩放到224×224，不做数值单位转换。未来50帧越界重复末帧。</p><p>模型明确用GT depth与K/c2w反投影，保留严格位于工作域内部的像素，mask不由预测depth生成。</p><div class="warning">论文工作域按米制定义，因此数据必须与该坐标尺度兼容；但本轮没有读取实际npy或核验生成流程，不能声称已验证文件中的深度单位、keypoints坐标系和相机标定一致。</div>',[C('data_processing/robocasa_dataset.py',89,130),C('models/geopredict.py',391,405),C('models/geopredict.py',475,489)],true),
  N('c-depth-loss','loss',2205,720,'四项 masked Smooth L1','current/future × left/right',['各项 scalar；beta 默认 1'],'不是论文 Eq.(11) 的纯 L1。','<p>各幅图计算逐像素 Smooth L1，再乘 GT 反投影掩码、除以 mask.sum()+1e-6。当前每相机在 batch 上平均；未来每相机在 B×50 上平均，最后四项相加。</p><p>没有将两相机、当前与未来合并为一个总像素加权平均；每幅图分别归一化。MAE 仅作统计，不是反传损失。</p>',[C('models/geopredict.py',391,413),C('models/geopredict.py',475,499)],true),
  N('c-flow','action',315,700,'Flow-Matching 扰动','tf ~ 0.999·Beta(1.5,1)+0.001',['xt = tf·ε + (1−tf)·A','ut = ε − A'],'ε 的形状为 B × 50 × 32。','<p>每个样本采样一个连续噪声时间。模型学习速度场 ut，而不是直接分类或回归离散动作标签。</p><p>tf 不是轨迹未来帧 τ，也不参与空间 PE 的 50 个位置索引。</p>',[C('models/geopredict.py',265,270)],true),
  N('c-suffix','action',630,700,'State + Noisy Action Tokens','32 → 1024；动作与时间融合',['B × 1 × 1024','B × 50 × 1024'],'suffix 共 51 tokens，两个因果块。','<p>state 线性投影为 1 token；noisy action 投影后拼接 1024 维 time embedding，经 Linear 2048→1024、SiLU、Linear 1024→1024。</p><p>State block 不可见 Action block；Action block 内部 50 步全双向，同时可看 State 与全部有效 prefix。</p>',[C('models/geopredict.py',108,112),C('models/geopredict.py',193,223)]),
  N('c-expert','action',945,720,'Action Output Projection','suffix 最后 50 tokens',['B × 50 × 1024 → ×32'],'Linear 输出动作速度，不是末端 XYZ。','<p>训练时 prefix/suffix 一次联合 forward。取 suffix 的最后 50 个位置，经 action_out_proj 得到速度预测 vt。</p><p>动作专家参数与 VLM 不同，但逐层共享 attention 上下文；本图连线是这一耦合的概念展开。</p>',[C('models/geopredict.py',272,288),C('models/gemma.py',88,112)]),
  N('c-action-loss','loss',1260,720,'Action MSE','全部 B × 50 × 32 取均值',['mean((vt − ut)²)'],'代码未单独屏蔽 padding 动作通道。','<p>模型输出 32 维。数据接口实际控制为 12 维，但代码直接对所有模型通道 square(...).mean()；不要把训练损失写成仅 12 或 7 维。</p>',[C('models/geopredict.py',265,288)],true),
  N('c-total','loss',1890,750,'七个标量项联合反传','1 动作 + 2 轨迹 + 4 深度',['返回 losses, loss_dict, acc_dict'],'AdamW / BF16 / ZeRO-3；未冻结 backbone。','<p>损失就是上述七项相加，训练调用 model.backward(losses)，没有另一个脚本重新加权。Optimizer 接收 model.parameters()，所读模型 / 训练路径没有 requires_grad=False 或训练分支 detach。</p><p>共享 backbone 同时受三种任务约束；但硬体素索引没有坐标梯度。不能把所有数据箭头当作可微梯度箭头。</p><p>脚本 40,000 steps；DeepSpeed 每卡 micro-batch 4、accumulation 1、BF16 与 ZeRO-3。实际总 batch 依运行 GPU 数确定，本页未启动训练。</p>',[C('models/geopredict.py',284,312),C('models/geopredict.py',493,502),C('tools/train_robocasa.py',87,123),C('utils/optimizer.py',5,17),C('configs/ds_bf16_z3_config.json',1,13)],true)

 inference:{label:'03 推理路径',scope:'沿 sample_actions 与 RoboCasa 测试入口；保留历史与 3D queries，一次 prefix KV + 默认 10 步动作积分，无显式 3D 解码。',formula:'公开推理：prefix 一次 → 10 次 Euler 动作更新 → 输出 50×32 → 反归一化取 12 维 → 默认执行 5 步重规划。',nodes:[
  N('i-observations','input',0,0,'当前 RGB + 语言','与训练一致的观测编码',['3 路 B × 3 × 224 × 224','text ids / mask: B × 48'],'不输入未来图像或深度；不做 ColorJitter。','<p>评测环境 camera_depths=False。三路当前RGB经resize / normalize、文本分词后进入编码器。模型设eval，因此没有训练时的RGB色彩增强。</p><p>环境render后的图像使用<code>[::-1]</code>反转行序，实际仅上下翻转；源码注释中的“rotate 180 degrees”不应直接当成实现。</p>',[C('tools/test_robocasa.py',144,154),C('tools/test_robocasa.py',244,280),C('tools/test_robocasa.py',365,370),C('data_processing/utils.py',12,40)]),
  N('i-history','input',0,240,'历史关键点轨迹','动作执行后记录，重规划时含最新姿态',['B × 1000 × 8 × 3','his_len 控制有效长度'],'训练[:t]不含当前；评测包含最新姿态。','<p>评测逐步读取robot0_link1…7与gripper0_right_eef的body position，变换到episode开始时的参考底座坐标，再减去偏移[-0.5,-0.8,0]。每次env.step之后立即记录点位。</p><div class="warning">下次重规划使用这个缓冲区，因此其末帧包含当前观测对应的最新姿态；训练样本却用keypoints[:t]，不含当前帧。两条路径的时间边界不能统一写成t−1；是否造成性能影响尚未做实验。</div><p>首个规划步骤使用长度1的全零历史；初始稳定等待阶段不记录历史。真实部署需提供对应运动学轨迹，代码没有从纯RGB恢复全部历史点。</p>',[C('tools/test_robocasa.py',180,194),C('tools/test_robocasa.py',223,260),C('tools/test_robocasa.py',299,304),C('data_processing/robocasa_dataset.py',79,87),S(3,'§8 · 时间歧义动机')]),
  N('i-state','input',0,495,'当前本体状态','末端位置 / 轴角 / 夹爪位置',['8 → padding32 → 1024'],'state = 3 + 3 + 2，不是 7 维。','<p>评测拼接 eef_pos 3维、eef_quat 转轴角 3维、gripper_qpos 2维。padding 到32并归一化，State projection 输出1个1024维 token。</p>',[C('tools/test_robocasa.py',265,280),C('data_processing/data_transform.py',47,80),C('models/geopredict.py',193,203)]),
  N('i-track-encoder','token',305,240,'Track Encoder','patch4 + 共享 query cross-attention',['B × 8 × 2048'],'保留的是历史编码，不是未来坐标解码。','<p>历史轨迹仍进入 embed_prefix，再由 TrackEncoder 提供8个历史tokens。sample_actions 没有调用 keypoint_out_proj 来输出未来 XYZ。</p>',[C('models/geopredict.py',165,172),C('models/keypoints.py',150,213),P(5,'§3.4 · Inference')]),
  N('i-queries','token',305,0,'学习得到的 3D Queries','future track8 + spatial320',['B × 328 × 2048'],'保留 latent tokens，不展开高斯场。','<p>8个未来轨迹 query 与320个空间 query 仍进入 prefix；空间 query 保留其3D位置编码。推理时不做未来50帧 temporal PE 展开，因为后续显式解码头根本不执行。</p>',[C('models/geopredict.py',174,183),C('models/geopredict.py',504,542)]),
  N('i-prefix','backbone',610,95,'Prefix Transformer','每次重新规划只计算一次',['B × 1152 × 2048'],'llm([prefix_tokens, None])。','<p>768 image +48 text positions +8 history +8 future queries +320 spatial queries，合计1152个prefix位置，文字padding仍有mask。</p><p>一次forward填充所有18层KV。执行完重规划窗口后，用新观测与更新历史重新构建，不是跨整个episode永久复用旧cache。</p>',[C('models/geopredict.py',513,517),C('models/gemma.py',274,297)]),
  N('i-kv','backbone',915,95,'18 层 KV Cache','每层 1 KV head × 256',['K、V 各 18 × B × 1152 × 1 × 256'],'缓存保留在当前50步chunk的10轮积分内。','<p>Gemma 每层输出K/V并在层维stack。动作去噪每轮传入相同的prefix cache；新生成的suffix cache不替代原prefix。</p><p>缓存的是隐变量注意力表示，不是显式的未来3D坐标、深度或高斯集合。</p>',[C('models/gemma.py',146,153),C('models/gemma.py',292,297),C('models/geopredict.py',519,540)]),

  N('i-expert','action',915,495,'10 次动作专家积分','suffix：1 state + 50 action',['B × 51 × 1024','xt ← xt + dt·vt'],'只运行action参数路径，反复读取prefix KV。','<p>每轮重新嵌入state、当前noisy actions和tf；调用llm([None,suffix_tokens],kv_cache=prefix_cache)。最后50个suffix tokens输出32维速度，再做Euler更新。</p><p>当前源码默认10步；使用者可调整num_steps，但本页不把调整后的值称为论文默认。</p>',[C('models/geopredict.py',519,542),C('models/geopredict.py',193,223)]),

const AUDIT_ITEMS = [
 {title:'01 · 主体结构一致，参数不能混写',body:'<p>论文与代码都是“历史运动压缩 + 未来轨迹监督 + 预测3DGS监督 + π0动作专家”。不是冻结3D teacher、mesh重建或显式几何规划器。</p><p>本页先依正式论文重建概念架构，再按固定源码逐段核对，而非把一张框架图的空白用经验补齐。</p>',refs:[P(3,'Fig.1 / §3.1–3.2'),P(4,'§3.3')]},
 {title:'02 · 粗网格与体素特征宽度不同',body:'<p>论文：每轴4倍降采样、C′=256，但1.0/0.04/4=6.25，正文未说明z如何整数化。</p><p>代码：空间query明确8×8×5=320；解码两次×2得到32×32×20，再插值40×40×25，保存的特征是128通道。部分注释中的256不能覆盖实际层定义。</p>',refs:[P(4,'Eq.(4–6)'),P(6,'§4.1'),C('models/geopredict.py',123,139),C('models/head.py',5,49)]},
 {title:'03 · 深度目标：论文L1，源码Smooth L1',body:'<p>论文Eq.(11)是masked L1。公开实现使用masked smooth_l1_loss，默认beta=1。</p><p>两个相机分别累加；当前段按B平均、未来段按B×50平均，各图先按自身有效像素归一化。这与把所有相机和时刻合并一次总像素平均的口径不同。</p>',refs:[P(5,'Eq.(11)'),C('models/geopredict.py',391,413),C('models/geopredict.py',475,499)]},
 {title:'04 · 轨迹 / 深度监督确实覆盖当前+50槽',body:'<p>论文Eq.(2–3)为0…H，共51时刻。代码当前单独解码，未来50个时间槽复用时间PE；数据越界时重复episode末帧，不是随机只抽3个未来时刻。</p><p>轨迹代码是current.mean()+future.mean()，不是51帧统一mean；valid_mask控制PE，不屏蔽loss。动作标签则为t…t+49，要与t+1…t+50的未来几何标签区分。</p>',refs:[P(4,'Eq.(2–3)'),C('data_processing/robocasa_dataset.py',72,75),C('data_processing/robocasa_dataset.py',89,116),C('models/geopredict.py',290,312),C('models/geopredict.py',415,433)]},
 {title:'05 · 有RGB通道，不等于有RGB监督',body:'<p>论文几何基元只列μ、α、Σ并声明省略颜色。代码每高斯14维，包含RGB，renderer也返回RGB；但compute_loss只取depth，没有颜色重建或SSIM损失。</p><p>所以准确说法是“深度监督，不使用RGB重建loss”，而不是“代码完全没有颜色参数”。</p>',refs:[P(4,'§3.3 · Gaussian parameters'),C('models/geopredict.py',225,244),C('models/gaussian.py',168,240)]},
 {title:'06 · 加密选择是3³邻域硬索引',body:'<p>论文Eq.(7)描述关键点所在体素；代码还扩张3×3×3邻域并去重。局部每体素额外64个、全局每体素4个，数量一致但选区更宽。</p><p>floor→long→index使depth loss不能沿选择路径直接对预测坐标求梯度；depth仍可经局部特征更新decoder/backbone。图上的数据连线不是全链路梯度承诺。</p>',refs:[P(4,'Eq.(7–8)'),C('models/utils.py',59,92),C('models/geopredict.py',351,380)]},
 {title:'07 · 论文MLP概念与发布层定义',body:'<p>论文TrackEncoder用MLP(T)概括轨迹嵌入；代码使用Conv1d时间patch4、共享512维query、8-head cross-attention与后续FFN。未来XYZ头实际是Linear(2048,3)。</p><p>refine_gs_mlp虽然名为MLP，发布代码是三个Linear连续堆叠，中间没有非线性激活；offset_act已定义，但实际中心使用raw offsets。这里只记录源码事实，不擅自修改作者实现。</p>',refs:[P(3,'Eq.(1)'),P(4,'Eq.(2 / 7)'),C('models/keypoints.py',8,49),C('models/keypoints.py',150,213),C('models/geopredict.py',117,139),C('models/geopredict.py',235,242)]},
 {title:'08 · 7维概念动作 ≠ 12维RoboCasa接口 ≠ 32维模型通道',body:'<p>论文§3.1定义7维末端动作；公开RoboCasa数据取12维控制量、当前状态8维，分别padding到32。模型输出50×32，评测反归一化后取前12维。</p><p>在当前实现中，动作MSE对全部32通道求平均，不能仅按论文7维估算损失张量。</p>',refs:[P(3,'§3.1'),C('data_processing/robocasa_dataset.py',68,75),C('models/geopredict.py',284,286),C('data_processing/data_transform.py',83,103)]},
 {title:'09 · 五块注意力相符，不是全序列双向',body:'<p>代码mask_ar累计得到2D、历史、3D query、State、Action五块，与正文§3.4的概念可见性一致（另叠加token有效性mask）。</p><p>future track与spatial queries在同块相互可见；2D和历史不能看后面的3D queries，prefix不能看state/actions。VLM与动作expert是两套权重，在每层attention交互，不是简单串接最后一层输出。</p><p>因此几何前缀没有显式读取suffix中的当前本体state、动作噪声或flow time；这不排除图像与历史轨迹间接包含当前姿态。动作专家读取几何query的隐藏K/V，而不是已解码XYZ、高斯或深度。注意力方向不等于stop-gradient。</p>',refs:[P(5,'Fig.2'),C('models/geopredict.py',21,28),C('models/geopredict.py',141,223),C('models/gemma.py',88,191)]},
 {title:'10 · 推理保留历史与queries，但不调用显式3D头',body:'<p>原文§3.4和sample_actions都保留历史编码及3D queries；不能据“训练期辅助”删掉整个运动历史模块。</p><p>公开默认10步Euler，输出50步但执行前5步重规划。评测不请求深度传感器，却从仿真读取机器人3D关键点；这不是纯RGB无运动学的输入条件。</p><p>构造函数与checkpoint仍含辅助模块，未自动做模型裁剪。</p>',refs:[P(5,'Inference'),C('models/geopredict.py',504,542),C('tools/test_robocasa.py',144,154),C('tools/test_robocasa.py',180,194),C('tools/test_robocasa.py',282,304)]},
 {title:'11 · 工作空间掩码来源有实现证据',body:'<p>论文只说将depth反投影，未明确使用GT或预测值；因此论文图保持这一边界。源码当前与未来两条路径都将cam_depth标签传给lift_to_3d，并用工作域严格边界构造mask。</p><p>所有未来渲染复用当前样本两组K/c2w；不能宣称此代码已处理未来相机运动。</p>',refs:[P(5,'Eq.(11)前文'),C('models/geopredict.py',322,328),C('models/geopredict.py',391,405),C('models/geopredict.py',475,489)]},
 {title:'12 · 核验范围与待实测边界',body:'<p>已读主文11页、附录4页，并核对数据集、历史编码、VLM/动作专家、VoxelDecoder、高斯参数/渲染、损失与推理入口。引用固定于5191756。</p><p>PDF的几何/训练公式和源码参数差异分开展示；无训练复现，也未审计外部CUDA光栅器的全部数学细节。项目提供训练代码，不等于当前本地依赖、权重和数据齐备。</p><p>网页另做语法、布局、节点/引用以及浏览器交互核验。详细记录见相邻 <a href="architecture_review.json" target="_blank" rel="noopener"><code>architecture_review.json</code></a>。</p>',refs:[C('models/geopredict.py',246,542),S(1,'附录§6–8'),S(4,'补充实验与视频说明')]},
 {title:'13 · 补充：线性未来轨迹头的结构限制',body:'<p>当前与未来共用Linear(2048,3)。未来只在输出embedding上加固定时间PE，没有再经过Transformer或非线性层。</p><div class="equation">p̂now = W·h + b0<br>p̂future = W·(h+PE[Δ−1]) + b0<br>p̂future − p̂now = W·PE[Δ−1]</div><p>固定权重、相同有效相对偏移Δ∈{1,…,50}时，忽略浮点舍入，该位移不依赖样本或关键点。绝对预测位置仍依赖h；尾部重复帧的Δ可能不同，不能按同一个future槽位直接比较。</p><div class="warning">这是当前公开快照的代数性质，并非实测精度结论。不能推广成整个GeoPredict、非线性VoxelDecoder或动作专家与输入无关，也不能据此宣称论文实验失效。</div>',refs:[C('models/geopredict.py',114,120),C('models/geopredict.py',290,310)]},
 {title:'14 · 补充：训练与在线历史的时间边界',body:'<p>训练明确使用keypoints[:t]，排除当前帧。评测每次env.step后写入关键点，所以下次重新规划时历史末帧包含最新当前姿态。首次规划则仍为一帧全零历史。</p><p>本页分开描述这两条时间边界；这是静态调用顺序差异，是否构成有害分布偏移需要运行数据与实验确认，不直接命名为已验证bug。</p>',refs:[C('data_processing/robocasa_dataset.py',79,90),C('tools/test_robocasa.py',232,242),C('tools/test_robocasa.py',257,279),C('tools/test_robocasa.py',299,304)]},
 {title:'15 · 补充：数据与默认参数的证据边界',body:'<p>训练只读取预制npy，没有在本轮核验其生成器或数据内容。模型要求深度、关键点、相机与论文米制工作域兼容；不能仅凭读取函数确认实际文件单位和坐标系正确。</p><p>状态/动作先补零再做mean/std归一化，未读取外部统计文件，不能保证padding最终仍是零。12维环境动作各分量的语义也未由这组读取代码完整定义。</p><p>训练入口未把CLI的horizon/dim/text长度传给数据集或模型，图中常数来自实际构造默认；batch来自DeepSpeed配置。评测图像的[::-1]只是上下翻转，不等同注释所称的180度旋转。</p>',refs:[C('data_processing/robocasa_dataset.py',18,24),C('data_processing/robocasa_dataset.py',68,75),C('data_processing/robocasa_dataset.py',89,130),C('tools/train_robocasa.py',69,73),C('configs/ds_bf16_z3_config.json',1,13),C('tools/test_robocasa.py',244,251)]}

const STORAGE_KEY = 'geopredict-architecture-layout-v1';
const SCHEMA = 'geopredict-architecture/1';
const MODES = ['paper','code','inference'].filter(id=>GRAPHS[id]);
const $ = id=>document.getElementById(id);
const escapeHTML = value=>String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const stage=$('stage'),world=$('world'),panel=$('inspector'),panelBody=$('panel-body');
let mode='paper',nodes=[],edges=[],nodeById=new Map(),selected=null,hovered=null,view={x:0,y:0,k:1},showLabels=true,toastTimer=null,saveTimer=null,positions={},views={},restoreWarning='';
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4000)}
function stateSnapshot(){rememberMode();return {schema:SCHEMA,mode,positions:structuredClone(positions),views:structuredClone(views),showLabels}}
function validNumber(v,bound){return typeof v==='number'&&Number.isFinite(v)&&Math.abs(v)<=bound}
function validateLayout(data){
 if(!data||data.schema!==SCHEMA||!MODES.includes(data.mode)||!data.positions||typeof data.positions!=='object'||Array.isArray(data.positions)||!data.views||typeof data.views!=='object'||Array.isArray(data.views)||typeof data.showLabels!=='boolean')throw Error('不是本页支持的 GeoPredict 布局文件');
 for(const [m,pos] of Object.entries(data.positions)){if(!MODES.includes(m)||!pos||typeof pos!=='object'||Array.isArray(pos))throw Error('视图坐标格式无效');const ids=new Set(GRAPHS[m].nodes.map(n=>n.id));for(const [id,xy] of Object.entries(pos)){if(!ids.has(id)||!Array.isArray(xy)||xy.length!==2||!xy.every(v=>validNumber(v,30000)))throw Error('节点坐标无效：'+id)}}
 for(const [m,v] of Object.entries(data.views)){if(!MODES.includes(m)||!v||!validNumber(v.x,100000)||!validNumber(v.y,100000)||!validNumber(v.k,3)||v.k<.08)throw Error('缩放或视野无效')}
 return data;
}
function rememberMode(){if(!nodes.length)return;positions[mode]=Object.fromEntries(nodes.map(n=>[n.id,[n.x,n.y]]));views[mode]={...view}}
function saveState(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify(stateSnapshot()))}catch{restoreWarning='浏览器不允许保存布局；仍可使用导出布局。'}},120)}
function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return;const data=validateLayout(JSON.parse(raw));mode=data.mode;positions=data.positions;views=data.views;showLabels=data.showLabels}catch{restoreWarning='旧布局不可用，已恢复默认；原始架构内容不受影响。'}}
function makeRef(ref){const title=ref.type==='code'?ref.file+' · L'+ref.start+'–'+ref.end:(ref.type==='paper'?'论文':'附录')+' PDF 第 '+ref.page+' 页';return '<a class="ref" href="'+escapeHTML(ref.url)+'" target="_blank" rel="noopener"><code>'+escapeHTML(title)+'</code><small>'+escapeHTML(ref.label)+'</small></a>'}
function showPanel(html,kicker='ARCHITECTURE NOTES'){panelBody.innerHTML=html;$('panel-kicker').textContent=kicker;panel.classList.add('open');panel.setAttribute('aria-hidden','false');$('panel-scroll').scrollTop=0}
function closePanel(){panel.classList.remove('open');panel.setAttribute('aria-hidden','true');selected=null;highlight(null)}
function showNode(id,center=false){const n=nodeById.get(id);if(!n)return;selected=id;const group=GROUPS[n.group];const ins=edges.filter(e=>e.to===id),outs=edges.filter(e=>e.from===id);const links=list=>list.map(e=>{const other=nodeById.get(e.from===id?e.to:e.from);return '<button data-jump="'+escapeHTML(other.id)+'">'+escapeHTML(other.title)+(e.label?' · '+escapeHTML(e.label):'')+'</button>'}).join('');showPanel('<h2>'+escapeHTML(n.title)+'</h2><p class="panel-sub">'+escapeHTML(n.subtitle)+'</p><span class="panel-tag">'+escapeHTML(GRAPHS[mode].label)+'</span><span class="panel-tag">'+escapeHTML(group.name)+(n.training?' · 仅训练':'')+'</span><h3>张量 / 参数</h3>'+n.shapes.map(s=>'<span class="shape">'+escapeHTML(s)+'</span>').join('')+'<h3>模块如何工作</h3>'+n.body+(ins.length?'<h3>输入来自</h3><div class="connections">'+links(ins)+'</div>':'')+(outs.length?'<h3>输出到</h3><div class="connections">'+links(outs)+'</div>':'')+'<h3>可追溯证据</h3>'+n.refs.map(makeRef).join(''));panelBody.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>showNode(b.dataset.jump,true)));highlight(id);if(center)requestAnimationFrame(()=>centerNode(n));}
function centerNode(n){view.k=Math.max(.75,view.k);view.x=stage.clientWidth/2-(n.x+n.w/2)*view.k;view.y=stage.clientHeight/2-(n.y+n.h/2)*view.k;applyView()}
function buildNodes(){
 $('node-layer').replaceChildren();nodeById=new Map();nodes=GRAPHS[mode].nodes.map((n,index)=>({...n,x:positions[mode]?.[n.id]?.[0]??n.x,y:positions[mode]?.[n.id]?.[1]??n.y,index}));
 for(const n of nodes){const g=GROUPS[n.group];const el=document.createElement('button');el.type='button';el.className='node'+(n.training?' training':'');el.dataset.id=n.id;el.setAttribute('aria-label',n.title+'：查看详细架构');el.style.setProperty('--node-color',g.color);el.style.setProperty('--node-tint',g.tint);el.style.left=n.x+'px';el.style.top=n.y+'px';el.innerHTML='<span class="top"><span class="index">'+String(n.index+1).padStart(2,'0')+'</span><span class="tag">'+(n.training?'TRAIN ONLY':escapeHTML(g.name))+'</span></span><span class="title">'+escapeHTML(n.title)+'</span><span class="subtitle">'+escapeHTML(n.subtitle)+'</span><span class="shapes">'+n.shapes.map(s=>'<span class="shape">'+escapeHTML(s)+'</span>').join('')+'</span><span class="note">'+escapeHTML(n.note)+'</span>';$('node-layer').appendChild(el);n.el=el;n.w=el.offsetWidth;n.h=el.offsetHeight;nodeById.set(n.id,n);bindNode(n);}
}
function bindNode(n){let suppressClick=false;n.el.addEventListener('click',()=>{if(suppressClick){suppressClick=false;return}showNode(n.id)});n.el.addEventListener('pointerenter',()=>{hovered=n.id;highlight(n.id)});n.el.addEventListener('pointerleave',()=>{hovered=null;highlight(selected)});n.el.addEventListener('pointerdown',event=>{if(event.button!==0||!event.isPrimary)return;event.stopPropagation();const sx=event.clientX,sy=event.clientY,ox=n.x,oy=n.y;let moved=false;n.el.setPointerCapture(event.pointerId);const move=e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(!moved&&Math.hypot(dx,dy)<5)return;moved=true;n.el.classList.add('dragging');n.x=Math.max(-20000,Math.min(20000,ox+dx/view.k));n.y=Math.max(-20000,Math.min(20000,oy+dy/view.k));n.el.style.left=n.x+'px';n.el.style.top=n.y+'px';redrawEdges()};const finish=e=>{n.el.removeEventListener('pointermove',move);n.el.removeEventListener('pointerup',finish);n.el.removeEventListener('pointercancel',cancel);n.el.classList.remove('dragging');if(n.el.hasPointerCapture(event.pointerId))n.el.releasePointerCapture(event.pointerId);suppressClick=moved;rememberMode();saveState();};const cancel=e=>{moved=true;finish(e)};n.el.addEventListener('pointermove',move);n.el.addEventListener('pointerup',finish);n.el.addEventListener('pointercancel',cancel)});n.el.addEventListener('keydown',e=>{if(!e.altKey||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();n.x+=e.key==='ArrowLeft'?-12:e.key==='ArrowRight'?12:0;n.y+=e.key==='ArrowUp'?-12:e.key==='ArrowDown'?12:0;n.el.style.left=n.x+'px';n.el.style.top=n.y+'px';redrawEdges();saveState()})}
function anchors(a,b){const dx=b.x+b.w/2-a.x-a.w/2,dy=b.y+b.h/2-a.y-a.h/2;if(Math.abs(dx)>Math.abs(dy)*.7){return dx>=0?[{x:a.x+a.w,y:a.y+a.h/2,dx:1,dy:0},{x:b.x,y:b.y+b.h/2,dx:-1,dy:0}]:[{x:a.x,y:a.y+a.h/2,dx:-1,dy:0},{x:b.x+b.w,y:b.y+b.h/2,dx:1,dy:0}]}return dy>=0?[{x:a.x+a.w/2,y:a.y+a.h,dx:0,dy:1},{x:b.x+b.w/2,y:b.y,dx:0,dy:-1}]:[{x:a.x+a.w/2,y:a.y,dx:0,dy:-1},{x:b.x+b.w/2,y:b.y+b.h,dx:0,dy:1}]}
function buildEdges(){$('edge-layer').replaceChildren();$('label-layer').replaceChildren();edges=GRAPHS[mode].edges.map(e=>({...e}));for(const e of edges){if(!nodeById.has(e.from)||!nodeById.has(e.to))throw Error('缺少连线端点：'+e.from+' → '+e.to);e.casing=document.createElementNS('http://www.w3.org/2000/svg','path');e.casing.setAttribute('class','casing');e.path=document.createElementNS('http://www.w3.org/2000/svg','path');e.path.setAttribute('class','edge '+e.kind);e.path.setAttribute('marker-end','url(#arrow)');$('edge-layer').append(e.casing,e.path);e.labelEl=document.createElement('div');e.labelEl.className='edge-label';e.labelEl.textContent=e.label;e.labelEl.hidden=!showLabels||!e.label;$('label-layer').appendChild(e.labelEl)}redrawEdges()}
function redrawEdges(){
 const occupied=[];
 for(const e of edges){
  const [p,q]=anchors(nodeById.get(e.from),nodeById.get(e.to));
  const len=Math.max(35,Math.min(145,Math.hypot(q.x-p.x,q.y-p.y)*.4));
  const c1={x:p.x+p.dx*len,y:p.y+p.dy*len},c2={x:q.x+q.dx*len,y:q.y+q.dy*len};
  const d='M '+p.x+' '+p.y+' C '+c1.x+' '+c1.y+', '+c2.x+' '+c2.y+', '+q.x+' '+q.y;
  e.path.setAttribute('d',d);e.casing.setAttribute('d',d);
  e.labelEl.hidden=!showLabels||!e.label;
  if(e.labelEl.hidden)continue;
  const w=e.labelEl.offsetWidth+6,h=e.labelEl.offsetHeight+5;
  let best=null;
  for(const t of [.5,.35,.65,.2,.8]){
   const u=1-t,mx=u*u*u*p.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*q.x,my=u*u*u*p.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*q.y;
   for(const shift of [-14,14,-32,32,-52,52]){
    const box={x:mx-w/2,y:my+shift-h/2,w,h};
    const overlap=b=>box.x<b.x+b.w+3&&box.x+box.w>b.x-3&&box.y<b.y+b.h+3&&box.y+box.h>b.y-3;
    if(!nodes.some(overlap)&&!occupied.some(overlap)){best={mx,my:my+shift,box};break}
   }
   if(best)break;
  }
  if(best){e.labelEl.style.left=best.mx+'px';e.labelEl.style.top=best.my+'px';occupied.push(best.box)}else e.labelEl.hidden=true;
 }
}
